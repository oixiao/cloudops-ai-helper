<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudOps AI · 多 Agent 协作工作台</title>

    <!-- 字体：与主控制台同一套（Chakra Petch + Outfit + Zen Maru Gothic + JetBrains Mono） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/orchestrate.css">
</head>
<body>

<div class="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
        <a href="/static/index.html" class="back-link"><i class="bi bi-arrow-left"></i> 返回控制台</a>
        <h1>多 Agent 协作工作台</h1>
        <span class="subtitle">Orchestrator 调度 · 并行执行 · 结果聚合</span>
    </header>

    <!-- Input Section -->
    <section class="input-section">
        <div class="input-card">
            <div class="input-header">
                <span class="label">任务描述</span>
                <span class="hint">Orchestrator 会自动拆解问题并分派给最合适的 Agent</span>
            </div>
            <textarea id="taskInput" class="task-input"
                placeholder="示例：服务器CPU持续90%，dmesg日志显示 Out of memory: Kill process 12345 (java)，应用响应超时，帮我全面排查并给出解决方案..."></textarea>
            <div class="input-footer">
                <div class="examples">
                    <span class="example-tag" onclick="fillExample('服务器CPU持续90%，dmesg日志显示OOM Killer杀掉了Java进程，帮我排查')">OOM 排查</span>
                    <span class="example-tag" onclick="fillExample('nginx错误日志大量出现 502 Bad Gateway，后端是Django服务，帮我分析原因并给出修复方案')">Nginx 502</span>
                    <span class="example-tag" onclick="fillExample('MySQL数据库磁盘空间不足报警，日志显示大量的慢查询，需要紧急处理')">数据库紧急</span>
                </div>
                <button class="submit-btn" onclick="submitTask()" id="submitBtn">
                    <i class="bi bi-play-fill"></i> 启动协作分析
                </button>
            </div>
        </div>
    </section>

    <!-- Agent Status Cards -->
    <section class="agents-section">
        <h2 class="section-title">Agent 状态面板</h2>
        <div class="agent-cards">
            <div class="agent-card" id="card-orchestrator">
                <div class="agent-icon"><i class="bi bi-crosshair"></i></div>
                <div class="agent-name">总指挥</div>
                <div class="agent-role">Orchestrator</div>
                <div class="agent-status pending" id="status-orchestrator">等待任务</div>
                <div class="agent-task" id="task-orchestrator"></div>
            </div>
            <div class="agent-card" id="card-log_analyzer">
                <div class="agent-icon"><i class="bi bi-search"></i></div>
                <div class="agent-name">日志分析</div>
                <div class="agent-role">LogAnalyzer</div>
                <div class="agent-status idle" id="status-log_analyzer">待命中</div>
                <div class="agent-task" id="task-log_analyzer"></div>
            </div>
            <div class="agent-card" id="card-cmd_generator">
                <div class="agent-icon"><i class="bi bi-terminal"></i></div>
                <div class="agent-name">命令生成</div>
                <div class="agent-role">CmdGenerator</div>
                <div class="agent-status idle" id="status-cmd_generator">待命中</div>
                <div class="agent-task" id="task-cmd_generator"></div>
            </div>
            <div class="agent-card" id="card-script_generator">
                <div class="agent-icon"><i class="bi bi-file-earmark-code"></i></div>
                <div class="agent-name">脚本生成</div>
                <div class="agent-role">ScriptGenerator</div>
                <div class="agent-status idle" id="status-script_generator">待命中</div>
                <div class="agent-task" id="task-script_generator"></div>
            </div>
        </div>
    </section>

    <!-- Execution Log -->
    <section class="log-section">
        <h2 class="section-title">执行日志</h2>
        <div class="log-panel" id="logPanel">
            <div class="log-entry placeholder">
                <span class="time">--:--:--</span>
                <span class="agent-tag">系统</span>
                <span class="message">等待提交任务...</span>
            </div>
        </div>
    </section>

    <!-- Diagnosis Report -->
    <section class="report-section" id="reportSection" style="display:none;">
        <h2 class="section-title">诊断报告</h2>
        <div class="report-card">
            <div class="report-content" id="reportContent"></div>
        </div>
    </section>
</div>

<script src="/static/js/orchestrate.js"></script>
</body>
</html>
